<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KraftKurve Training Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&amp;family=Geist:wght@400&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#7213ff",
                        "on-tertiary": "#3c0090",
                        "on-secondary": "#5b005b",
                        "surface-container-lowest": "#0e0e10",
                        "tertiary-fixed-dim": "#d1bcff",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#b9cacb",
                        "primary-fixed": "#7df4ff",
                        "surface-bright": "#39393b",
                        "on-background": "#e5e1e4",
                        "secondary-container": "#fe00fe",
                        "surface": "#131315",
                        "on-secondary-container": "#500050",
                        "on-primary-fixed": "#002022",
                        "on-surface": "#e5e1e4",
                        "secondary-fixed-dim": "#ffabf3",
                        "outline-variant": "#3b494b",
                        "background": "#131315",
                        "inverse-surface": "#e5e1e4",
                        "tertiary-container": "#e1d2ff",
                        "on-tertiary-fixed": "#23005b",
                        "secondary": "#ffabf3",
                        "on-secondary-fixed-variant": "#810081",
                        "error-container": "#93000a",
                        "tertiary": "#faf3ff",
                        "primary-container": "#00f0ff",
                        "surface-tint": "#00dbe9",
                        "surface-dim": "#131315",
                        "surface-container-high": "#2a2a2c",
                        "on-secondary-fixed": "#380038",
                        "outline": "#849495",
                        "on-error": "#690005",
                        "inverse-on-surface": "#313032",
                        "surface-container-highest": "#353437",
                        "on-primary": "#00363a",
                        "surface-variant": "#353437",
                        "inverse-primary": "#006970",
                        "primary": "#dbfcff",
                        "on-tertiary-fixed-variant": "#5700c9",
                        "on-primary-fixed-variant": "#004f54",
                        "secondary-fixed": "#ffd7f5",
                        "surface-container-low": "#1c1b1d",
                        "tertiary-fixed": "#e9ddff",
                        "primary-fixed-dim": "#00dbe9",
                        "error": "#ffb4ab",
                        "surface-container": "#201f21",
                        "on-primary-container": "#006970"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Anybody"],
                        "headline-lg-mobile": ["Anybody"],
                        "label-caps": ["Space Mono"],
                        "body-md": ["Geist"],
                        "stats-lg": ["Anybody"],
                        "headline-lg": ["Anybody"]
                    },
                    "fontSize": {
                        "headline-xl": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "stats-lg": ["40px", { "lineHeight": "1.0", "fontWeight": "900" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        /* Neon Glows */
        .glow-primary { box-shadow: 0 0 15px rgba(0, 219, 233, 0.2); }
        .glow-secondary { box-shadow: 0 0 15px rgba(254, 0, 254, 0.2); }
        .glow-text-primary { text-shadow: 0 0 8px rgba(0, 219, 233, 0.5); }
        
        /* Progress Bar Pixelation */
        .pixel-progress {
            background-image: linear-gradient(to right, theme('colors.secondary-container') 50%, theme('colors.primary-container') 100%);
            mask-image: linear-gradient(to right, black 90%, transparent 100%);
            background-size: 10px 100%;
        }

        /* Form Inputs */
        .training-input {
            background: theme('colors.surface-container-high');
            border: none;
            border-bottom: 2px solid theme('colors.outline-variant');
            color: theme('colors.primary');
            text-align: center;
        }
        .training-input:focus {
            outline: none;
            border-bottom-color: theme('colors.primary-container');
            box-shadow: 0 4px 10px rgba(0, 240, 255, 0.1);
        }
        
        /* Hide arrows on number inputs */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md antialiased pb-[100px] pt-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-[0_0_20px_rgba(0,219,233,0.1)]">
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/50 overflow-hidden">
<span class="material-symbols-outlined text-primary text-[18px]">person</span>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tighter italic uppercase text-primary dark:text-primary-fixed-dim">KraftKurve</span>
</div>
<button class="text-on-surface-variant hover:text-primary-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">notifications</span>
</button>
</header>
<main class="px-margin-mobile">
<!-- Header Info -->
<div class="mt-4 mb-6">
<div class="flex justify-between items-end mb-2">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background glow-text-primary">Hypertrophy Block D3</h1>
<p class="font-label-caps text-label-caps text-secondary-container mt-1">Chest &amp; Triceps Focus</p>
</div>
<div class="text-right">
<span class="font-stats-lg text-stats-lg text-primary">45</span><span class="font-label-caps text-label-caps text-on-surface-variant ml-1">MIN</span>
</div>
</div>
<!-- Pixelated Progress Bar -->
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden mt-4">
<div class="h-full pixel-progress w-[60%]"></div>
</div>
</div>
<!-- Exercise 1: Barbell Bench Press -->
<section class="bg-[#0A0A0C] border-t-2 border-primary-container rounded-lg p-4 mb-6 relative glow-primary">
<div class="flex justify-between items-center mb-4 border-b border-outline-variant/30 pb-2">
<h2 class="font-headline-lg-mobile text-[22px] leading-tight text-on-background">Barbell Bench Press</h2>
<div class="bg-primary-container/10 px-2 py-1 rounded border border-primary-container/30 flex items-center gap-1">
<span class="material-symbols-outlined text-primary-container text-[14px]">info</span>
<span class="font-label-caps text-label-caps text-primary-container">3 SETS</span>
</div>
</div>
<div class="space-y-3">
<!-- Set 1 -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-DEFAULT">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-label-caps text-label-caps text-on-surface">1</div>
<div class="flex-1 grid grid-cols-2 gap-4">
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="100"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">KG</span>
</div>
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="8"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">REPS</span>
</div>
</div>
<button class="w-10 h-10 rounded-DEFAULT bg-primary-container text-[#002022] flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
<!-- Set 2 -->
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-DEFAULT">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-label-caps text-label-caps text-on-surface">2</div>
<div class="flex-1 grid grid-cols-2 gap-4">
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="100"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">KG</span>
</div>
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="8" type="number"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">REPS</span>
</div>
</div>
<button class="w-10 h-10 rounded-DEFAULT border border-outline-variant text-outline-variant flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined">check</span>
</button>
</div>
</div>
<button class="w-full mt-4 py-2 border border-dashed border-outline-variant text-outline flex items-center justify-center gap-2 font-label-caps text-label-caps rounded-DEFAULT hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span> ADD SET
            </button>
</section>
<!-- Superset Indicator -->
<div class="flex items-center justify-center gap-2 mb-2">
<div class="h-[1px] bg-secondary-container/50 flex-1"></div>
<div class="bg-secondary-container text-[#500050] font-label-caps text-label-caps px-3 py-1 rounded-full flex items-center gap-1 shadow-[0_0_10px_rgba(254,0,254,0.3)]">
<span class="material-symbols-outlined text-[14px]">link</span> SUPERSET
            </div>
<div class="h-[1px] bg-secondary-container/50 flex-1"></div>
</div>
<!-- Exercise 2A: Incline DB Flyes (Superset A) -->
<section class="bg-[#0A0A0C] border-l-4 border-secondary-container rounded-lg rounded-l-none p-4 mb-2 relative">
<div class="flex justify-between items-center mb-4 border-b border-outline-variant/30 pb-2">
<h2 class="font-headline-lg-mobile text-[22px] leading-tight text-on-background">Incline DB Flyes</h2>
<span class="font-label-caps text-label-caps text-secondary-container">2A</span>
</div>
<div class="space-y-3">
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-DEFAULT">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-label-caps text-label-caps text-on-surface">1</div>
<div class="flex-1 grid grid-cols-2 gap-4">
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="20"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">KG</span>
</div>
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="12"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">REPS</span>
</div>
</div>
<button class="w-10 h-10 rounded-DEFAULT bg-secondary-container text-[#500050] flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
</div>
</section>
<!-- Exercise 2B: Pushups (Superset B) -->
<section class="bg-[#0A0A0C] border-l-4 border-secondary-container rounded-lg rounded-l-none p-4 mb-6 relative">
<div class="flex justify-between items-center mb-4 border-b border-outline-variant/30 pb-2">
<h2 class="font-headline-lg-mobile text-[22px] leading-tight text-on-background">Pushups (AMRAP)</h2>
<span class="font-label-caps text-label-caps text-secondary-container">2B</span>
</div>
<div class="space-y-3">
<div class="flex items-center gap-4 bg-surface-container-low p-2 rounded-DEFAULT">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center font-label-caps text-label-caps text-on-surface">1</div>
<div class="flex-1 grid grid-cols-2 gap-4">
<div class="relative opacity-50 pointer-events-none">
<input class="w-full training-input font-stats-lg text-[24px] py-1" disabled="" type="text" value="BW"/>
</div>
<div class="relative">
<input class="w-full training-input font-stats-lg text-[24px] py-1" placeholder="0" type="number" value="22"/>
<span class="absolute right-0 bottom-2 font-label-caps text-label-caps text-outline-variant pointer-events-none">REPS</span>
</div>
</div>
<button class="w-10 h-10 rounded-DEFAULT bg-secondary-container text-[#500050] flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
</div>
</section>
<!-- Finish Workout Button -->
<div class="mt-8 mb-4">
<button class="w-full bg-primary-container text-[#002022] font-label-caps text-label-caps py-4 rounded-xl flex items-center justify-center gap-2 glow-primary active:scale-95 transition-all">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sports_score</span>
                FINISH WORKOUT
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe pt-2 h-20 bg-surface-container-low/90 dark:bg-surface-container-low/90 backdrop-blur-2xl rounded-t-xl border-t border-outline-variant/50 shadow-[0_-4px_20px_rgba(254,0,254,0.1)]">
<button class="flex flex-col items-center justify-center text-outline opacity-70 hover:text-primary transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-caps text-[10px] mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,219,233,0.5)] active:scale-90 duration-150">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-[10px] mt-1">Training</span>
</button>
<button class="flex flex-col items-center justify-center text-outline opacity-70 hover:text-primary transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">restaurant</span>
<span class="font-label-caps text-[10px] mt-1">Nutrition</span>
</button>
<button class="flex flex-col items-center justify-center text-outline opacity-70 hover:text-primary transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-label-caps text-[10px] mt-1">Progress</span>
</button>
</nav>
</body></html>
