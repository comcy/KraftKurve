<div class="app-layout">
  <header class="app-header">
    <nav class="app-nav">
      <a class="app-logo" routerLink="/dashboard">KraftKurve</a>

      @if (isUser()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
        <a routerLink="/training" routerLinkActive="active" class="nav-link">Training</a>
        <a routerLink="/nutrition" routerLinkActive="active" class="nav-link">Nutrition</a>
        <a routerLink="/progress" routerLinkActive="active" class="nav-link">Progress</a>
      }

      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Admin</a>
        <a routerLink="/admin/invites" routerLinkActive="active" class="nav-link">Invites</a>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">Nutzer</a>
        <a routerLink="/admin/exercises" routerLinkActive="active" class="nav-link">Katalog</a>
      }

      <span class="spacer"></span>

      @if (!isLoggedIn()) {
        <a routerLink="/auth/login" class="login-btn">Login</a>
      } @else {
        <a routerLink="/profile" title="Profil" aria-label="Profil" class="profile-btn">
          {{ isAdmin() ? 'A' : 'U' }}
        </a>
        <button type="button" (click)="logout()" class="logout-btn">Logout</button>
      }
    </nav>
  </header>

  <router-outlet />
</div>
