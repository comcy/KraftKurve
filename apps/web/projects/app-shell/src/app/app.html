<div class="app-layout">
  <mat-toolbar color="primary" class="app-header">
    <a class="app-logo" [routerLink]="routeDashboard">
      <img src="header_logo_style.png" alt="KraftKurve Logo" class="header-logo-img">
    </a>

    <nav class="app-nav">
      @if (isLoggedIn()) {
      <a mat-button [routerLink]="routeTraining" routerLinkActive="active" *ifPermission="'TRACK_TRAINING'">{{
        labelTraining }}</a>
      <a mat-button [routerLink]="routeNutrition" routerLinkActive="active" *ifPermission="'TRACK_NUTRITION'">{{
        labelNutrition }}</a>
      <a mat-button [routerLink]="routeProgress" routerLinkActive="active" *ifPermission="'VIEW_PROGRESS'">{{
        labelProgress }}</a>
      <a mat-button [routerLink]="routeAdmin" routerLinkActive="active" *ifPermission="'VIEW_ADMIN_DASHBOARD'">{{
        labelAdmin }}</a>
      }
    </nav>

    <span class="spacer"></span>

    <div class="header-actions">
      <span class="mfe-badge" *ifPermission="'VIEW_ADMIN_DASHBOARD'">{{ mfeVersion }}</span>
      <button mat-icon-button (click)="toggleTheme()"
        [matTooltip]="themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode'">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      @if (!isLoggedIn()) {
      <a mat-flat-button [routerLink]="routeAuthLogin" color="accent">{{ labelLogin }}</a>
      } @else {
      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User profile">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info" mat-menu-item disabled>
          {{ currentUser()?.email }}
        </div>
        <a mat-menu-item [routerLink]="routeProfile">
          <mat-icon>person</mat-icon>
          <span>{{ labelProfile }}</span>
        </a>
        <hr>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ labelLogout }}</span>
        </button>
      </mat-menu>
      }
    </div>
  </mat-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
