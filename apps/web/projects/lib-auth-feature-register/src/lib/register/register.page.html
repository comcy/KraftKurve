<main class="auth-page">
  <section class="log-card auth-tactical-card">
    <div class="log-header tape">ENROLLMENT_TERMINAL</div>
    <div class="log-content">
      <div class="auth-header">
        <h1 class="label-caps">New_Account</h1>
        <p class="data-mono">INVITE_REQUIRED_FOR_ACCESS</p>
      </div>

      <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        @if (serverError()) {
          <div class="error-banner tactical-border" aria-live="polite">
            <p class="data-mono error-text">{{ serverError() }}</p>
          </div>
        }

        <label class="auth-field">
          <span class="label-caps">Invite-Code</span>
          <input class="tactical-input data-mono" type="text" formControlName="inviteCode" placeholder="CODE_REQUIRED" />
          @if (registerForm.controls.inviteCode.touched && registerForm.controls.inviteCode.hasError('required')) {
            <p class="error-msg label-caps">REQUIRED</p>
          }
        </label>

        <label class="auth-field">
          <span class="label-caps">Anzeigename</span>
          <input class="tactical-input data-mono" type="text" formControlName="displayName" autocomplete="name" placeholder="CALLSIGN" />
          @if (registerForm.controls.displayName.touched && registerForm.controls.displayName.hasError('required')) {
            <p class="error-msg label-caps">REQUIRED</p>
          }
        </label>

        <label class="auth-field">
          <span class="label-caps">E-Mail</span>
          <input class="tactical-input data-mono" type="email" formControlName="email" autocomplete="email" placeholder="USER@KRAFTKURVE.COM" />
          @if (registerForm.controls.email.touched && registerForm.controls.email.hasError('required')) {
            <p class="error-msg label-caps">REQUIRED</p>
          }
        </label>

        <label class="auth-field">
          <span class="label-caps">Passwort</span>
          <input class="tactical-input data-mono" type="password" formControlName="password" autocomplete="new-password" placeholder="********" />
          @if (registerForm.controls.password.touched && registerForm.controls.password.hasError('required')) {
            <p class="error-msg label-caps">REQUIRED</p>
          }
        </label>

        <button class="tactical-btn primary full-width" type="submit" [disabled]="submitting()">
          @if (submitting()) { ENROLLING... } @else { CREATE_ACCOUNT }
        </button>
      </form>

      <div class="auth-footer">
        <p class="label-caps">ALREADY_REGISTERED?</p>
        <a class="tactical-btn secondary sm" routerLink="/auth/login">GO_TO_LOGIN</a>
      </div>
    </div>
  </section>
</main>
