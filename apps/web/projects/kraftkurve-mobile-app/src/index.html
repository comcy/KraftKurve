<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KRAFTKURVE</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#131313">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script>
    (function() {
      var saved = localStorage.getItem('app-theme');
      // Backward compat: 'dark' → 'tactical', 'light' → 'minimal-light'
      var theme = saved === 'dark' ? 'tactical'
        : saved === 'light' ? 'minimal-light'
        : (['tactical', 'minimal-dark', 'minimal-light'].indexOf(saved) !== -1 ? saved : 'tactical');
      document.documentElement.classList.add('theme-' + theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
