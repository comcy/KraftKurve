<div class="dashboard-container">
  <!-- Engage Protocol -->
  <section class="log-card">
    <div class="punched-holes">
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
    </div>
    <div class="log-header tape">
      <span class="label-caps">{{ engageProtocol }}</span>
    </div>
    <div class="log-content">
      <div class="widget-grid">
        <button mat-flat-button class="protocol-btn scheduled btn-primary">
          <mat-icon>calendar_today</mat-icon>
          <span>{{ scheduled }}</span>
        </button>
        <button mat-stroked-button class="protocol-btn freestyle">
          <mat-icon>bolt</mat-icon>
          <span>{{ freestyle }}</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Fuel Status -->
  <section class="log-card">
    <div class="log-header">
      <div class="widget-title label-caps">
        <mat-icon>restaurant</mat-icon>
        {{ fuelStatus }}
      </div>
      <span class="badge label-caps">{{ protein }}</span>
    </div>

    <div class="log-content">
      <div class="fuel-stats">
        <div class="fuel-value data-mono">
          <span class="current">{{ proteinCurrent() }}g</span> / {{ proteinTarget() }}g
        </div>
        <div class="fuel-label label-caps">DAILY INTAKE</div>
      </div>

      <div class="segmented-progress">
        <div class="progress-fill" [style.width.%]="proteinPercentage()">
          <div class="segment"></div>
          <div class="segment"></div>
          <div class="segment"></div>
          <div class="segment"></div>
          <div class="segment"></div>
        </div>
      </div>

      <div class="fuel-actions">
        <button *ngFor="let amount of presets()" mat-stroked-button class="label-caps" (click)="onQuickLog(amount)">
          +{{ amount }}g
        </button>
      </div>
    </div>
  </section>

  <!-- Strength Index -->
  <section class="log-card">
    <div class="log-header">
      <h2 class="widget-title label-caps">
        <mat-icon>monitoring</mat-icon>
        {{ strengthIndex }}
      </h2>
    </div>
    <div class="log-content">
      <div class="chart-mock">
        <div class="bar-container">
          <div class="bar" style="height: 40%"></div><span class="label-caps">W1</span>
        </div>
        <div class="bar-container">
          <div class="bar" style="height: 55%"></div><span class="label-caps">W2</span>
        </div>
        <div class="bar-container">
          <div class="bar active" style="height: 70%"></div><span class="label-caps active">W3</span>
        </div>
        <div class="bar-container">
          <div class="bar active highlighted" style="height: 85%"></div><span class="label-caps active">W4</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Start Workout Action -->
  <div class="action-container">
    <button mat-flat-button class="start-btn btn-primary">
      <mat-icon>play_arrow</mat-icon>
      <span class="label-caps">{{ startWorkout }}</span>
    </button>
  </div>
</div>
