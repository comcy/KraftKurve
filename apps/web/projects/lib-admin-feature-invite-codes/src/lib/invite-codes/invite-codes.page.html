<main class="invite-page">
  <section class="log-card">
    <div class="log-header tape">INVITE_MANAGEMENT</div>
    <div class="log-content">
      <h2 class="label-caps">Invite-Codes</h2>
      <p class="data-mono">Admin darf nur User freischalten. Hier erzeugst du Invite-Codes.</p>

      <button class="tactical-btn primary full-width" (click)="createInvite()" [disabled]="creating()">
        {{ creating() ? 'ERZEUGE…' : '+ NEW_INVITE' }}
      </button>

      @if (error()) {
        <p class="error data-mono">{{ error() }}</p>
      }

      @if (!codes().length) {
        <p class="empty data-mono">NO_DATA_AVAILABLE</p>
      } @else {
        <div class="code-list">
          @for (entry of codes(); track entry.code) {
            <div class="code-item tactical-border">
              <div class="code-info">
                <div class="code-value data-mono">{{ entry.code }}</div>
                <div class="meta label-caps">EXP: {{ entry.expiresAt ?? 'INF' }}</div>
              </div>
              <button class="tactical-btn secondary sm" (click)="copy(entry.code)">COPY</button>
            </div>
          }
        </div>
      }
    </div>
  </section>
</main>
