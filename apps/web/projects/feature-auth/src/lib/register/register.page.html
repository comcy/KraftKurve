<section class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">Admin invite only</p>
    <h1 class="auth-title">Registrieren</h1>
    <p class="auth-copy">Nur mit gültigem Invite-Code. Danach ist der Zugang direkt aktiv.</p>

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      @if (serverError()) {
        <div class="auth-banner" aria-live="polite">
          <p class="auth-error">{{ serverError() }}</p>
        </div>
      }

      <label class="auth-field">
        <span class="auth-label">Invite-Code</span>
        <input class="auth-input" type="text" formControlName="inviteCode" />
        @if (registerForm.controls.inviteCode.touched && registerForm.controls.inviteCode.hasError('required')) {
          <p class="auth-error">Invite-Code ist erforderlich.</p>
        }
        @if (registerForm.controls.inviteCode.touched && registerForm.controls.inviteCode.hasError('minlength')) {
          <p class="auth-error">Invite-Code zu kurz.</p>
        }
      </label>

      <label class="auth-field">
        <span class="auth-label">Anzeigename</span>
        <input class="auth-input" type="text" formControlName="displayName" autocomplete="name" />
        @if (registerForm.controls.displayName.touched && registerForm.controls.displayName.hasError('required')) {
          <p class="auth-error">Anzeigename ist erforderlich.</p>
        }
        @if (registerForm.controls.displayName.touched && registerForm.controls.displayName.hasError('minlength')) {
          <p class="auth-error">Mindestens 2 Zeichen.</p>
        }
      </label>

      <label class="auth-field">
        <span class="auth-label">E-Mail</span>
        <input class="auth-input" type="email" formControlName="email" autocomplete="email" />
        @if (registerForm.controls.email.touched && registerForm.controls.email.hasError('required')) {
          <p class="auth-error">E-Mail ist erforderlich.</p>
        }
        @if (registerForm.controls.email.touched && registerForm.controls.email.hasError('email')) {
          <p class="auth-error">Bitte eine gültige E-Mail eingeben.</p>
        }
      </label>

      <label class="auth-field">
        <span class="auth-label">Passwort</span>
        <input class="auth-input" type="password" formControlName="password" autocomplete="new-password" />
        @if (registerForm.controls.password.touched && registerForm.controls.password.hasError('required')) {
          <p class="auth-error">Passwort ist erforderlich.</p>
        }
        @if (registerForm.controls.password.touched && registerForm.controls.password.hasError('minlength')) {
          <p class="auth-error">Mindestens 8 Zeichen.</p>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="submitting()">
        @if (submitting()) { Registrierung... } @else { Account anlegen }
      </button>
    </form>

    <p class="auth-footer">
      Bereits registriert? <a class="auth-link" routerLink="/auth/login">Zum Login</a>
    </p>
  </div>
</section>
