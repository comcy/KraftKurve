<section class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">KraftKurve</p>
    <h1 class="auth-title">Willkommen zurück</h1>
    <p class="auth-copy">Login für Shell, Training und Admin.</p>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      @if (serverError()) {
        <div class="auth-banner" aria-live="polite">
          <p class="auth-error">{{ serverError() }}</p>
        </div>
      }

      <label class="auth-field">
        <span class="auth-label">E-Mail</span>
        <input class="auth-input" type="email" formControlName="email" autocomplete="email" />
        @if (loginForm.controls.email.touched && loginForm.controls.email.hasError('required')) {
          <p class="auth-error">E-Mail ist erforderlich.</p>
        }
        @if (loginForm.controls.email.touched && loginForm.controls.email.hasError('email')) {
          <p class="auth-error">Bitte eine gültige E-Mail eingeben.</p>
        }
      </label>

      <label class="auth-field">
        <span class="auth-label">Passwort</span>
        <input class="auth-input" type="password" formControlName="password" autocomplete="current-password" />
        @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('required')) {
          <p class="auth-error">Passwort ist erforderlich.</p>
        }
        @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('minlength')) {
          <p class="auth-error">Mindestens 8 Zeichen.</p>
        }
      </label>

      <button class="auth-submit" type="submit" [disabled]="submitting()">
        @if (submitting()) { Anmeldung... } @else { Einloggen }
      </button>
    </form>

    <p class="auth-footer">
      Noch kein Zugang? <a class="auth-link" routerLink="/auth/register">Mit Invite registrieren</a>
    </p>
  </div>
</section>
